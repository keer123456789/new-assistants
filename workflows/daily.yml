name: Daily News Assistant

on:
  schedule:
    # 每天 UTC 23:30 (北京时间次日 07:30)
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push to telegram)'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-assistant
  cancel-in-progress: false

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.LLM_API_KEY }}" ]; then
            echo "❌ LLM_API_KEY 未配置！"
            echo "请去 Settings → Secrets and variables → Actions 添加 LLM_API_KEY"
            exit 1
          fi
          echo "✅ LLM_API_KEY 已配置"

      - name: Diagnostic check
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Working directory ==="
          pwd
          ls -la
          echo "=== Check config.yaml ==="
          if [ -f "config.yaml" ]; then
            echo "✅ config.yaml exists"
            cat config.yaml
          else
            echo "❌ config.yaml MISSING"
          fi
          echo "=== Check .github/workflows ==="
          ls -la .github/workflows/ || echo "missing"
          echo "=== Test imports ==="
          python -c "
import sys
sys.path.insert(0, '.')
try:
    from src.config import Config
    print('OK: src.config')
except Exception as e:
    print('FAIL: src.config:', e)
try:
    from src.fetcher.sources import SOURCES
    print(f'OK: src.fetcher.sources ({len(SOURCES)} sources)')
except Exception as e:
    print('FAIL: src.fetcher.sources:', e)
try:
    from src.processor.llm import LLMProcessor
    print('OK: src.processor.llm')
except Exception as e:
    print('FAIL: src.processor.llm:', e)
try:
    from src.storage import MarkdownReport, HTMLReport
    print('OK: src.storage')
except Exception as e:
    print('FAIL: src.storage:', e)
try:
    from src.pusher import TelegramPusher
    print('OK: src.pusher')
except Exception as e:
    print('FAIL: src.pusher:', e)
"
          echo "=== End diagnostic ==="

      - name: Run news assistant
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u scripts/run_daily.py --dry-run --skip-push 2>&1
          else
            python -u scripts/run_daily.py 2>&1
          fi

      - name: Verify output exists
        run: |
          if [ ! -d "output" ] || [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "❌ output 目录为空！"
            echo "脚本可能没有生成任何报告"
            exit 1
          fi
          echo "✅ output 目录内容："
          ls -la output/

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -v output/* _site/
          echo "✅ Files copied to _site:"
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit reports back to repo (backup)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily news report $(date +%Y-%m-%d)"
            git push
          fi
